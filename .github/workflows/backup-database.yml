name: Backup Database Harian

on:
  schedule:
    # Jalan setiap hari jam 02:00 WIB (19:00 UTC hari sebelumnya)
    - cron: '0 19 * * *'
  workflow_dispatch: {} # Supaya bisa dijalankan manual kapan saja dari tab "Actions" di GitHub

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL 17 Client (harus >= versi server Supabase)
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump Database dari Supabase
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          timestamp=$(date +'%Y-%m-%d_%H-%M-%S')
          /usr/lib/postgresql/17/bin/pg_dump "$DATABASE_URL" --no-owner --no-privileges -F c -f "backup_${timestamp}.dump"
          echo "BACKUP_FILE=backup_${timestamp}.dump" >> $GITHUB_ENV

      - name: Upload Backup sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup-${{ github.run_number }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30